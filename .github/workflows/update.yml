name: Update front office

on:
  schedule:
    - cron: "0 11 * * *"     # daily, 6 AM Central
    - cron: "0 22 * * 4"     # Thursday before TNF
    - cron: "0 22 * * 6"     # Saturday night, final injury reports
    - cron: "45 15 * * 0"    # Sunday after inactives (CDT)
    - cron: "45 16 * * 0"    # Sunday after inactives (CST)
    - cron: "0 22 * * 1"     # Monday before MNF
  workflow_dispatch:          # adds a "Run workflow" button for on-demand updates

permissions:
  contents: write

concurrency:
  group: front-office
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python front_office.py
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          MY_TEAM: "Get Shucked"
      - name: Save results
        run: |
          git config user.name "front-office-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git commit -m "Update $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
